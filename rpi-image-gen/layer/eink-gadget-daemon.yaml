# METABEGIN
# X-Env-Layer-Name: eink-gadget-daemon
# X-Env-Layer-Category: eink-gadget
# X-Env-Layer-Desc: Install e-ink-gadget display daemon and its Python dependencies.
#  Installs spidev, gpiozero, Pillow, and pyserial. Copies daemon source to
#  /opt/e-ink-gadget and enables the systemd service.
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Requires: eink-gadget-usb
# METAEND
---
mmdebstrap:
  packages:
    - python3-pip
    - python3-pil
    - python3-serial
    - python3-systemd
  customize-hooks:
    # Install pip packages (gpiozero + spidev for e-Paper display)
    - |-
      uchroot $1 pip3 install --break-system-packages spidev gpiozero
    # Copy daemon source files
    - |-
      mkdir -p $1/opt/e-ink-gadget/pi/vendor/waveshare_epd
      cp -r $DIRECTORY/eink-gadget-daemon/daemon-src/* $1/opt/e-ink-gadget/pi/
    # Install systemd service
    - |-
      cp $DIRECTORY/eink-gadget-daemon/eink-gadget.service $1/etc/systemd/system/
    # Enable the service to start at boot
    - |-
      $BDEBSTRAP_HOOKS/enable-units "$1" eink-gadget