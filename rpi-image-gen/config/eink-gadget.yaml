# e-ink-gadget config for rpi-image-gen
#
# Build command:
#   rpi-image-gen build -c eink-gadget.yaml \
#     -D IGconf_device_user1=dot \
#     -D 'IGconf_ssh_pubkey_user1=ssh-ed25519 AAAAC3...' \
#     -D 'IGconf_ssh_pubkey_only=y'
#
# The image will:
#   - Boot on Raspberry Pi 4
#   - Enable SSH with your public key (password auth disabled)
#   - Configure USB-C as a serial gadget (g_serial, 921600 baud)
#   - Auto-start the e-ink-gadget display daemon
#   - Enable SPI for the e-Paper display

device:
  layer: rpi4

image:
  layer: image-rpios
  boot_part_size: 200%
  root_part_size: 300%
  name: eink-gadget
  compression: zstd

layer:
  custom: eink-gadget-top